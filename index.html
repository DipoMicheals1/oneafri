<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneAfri Live Trading Terminal</title>
    <!-- Chart.js and Financial Chart Plugin CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.0.1/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.2.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.min.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-color: #ffffff;
            --accent-color: #4CAF50;
            --bear-color: #F44336;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
            margin-bottom: 20px;
        }

        .status-badge {
            background-color: #2e7d32;
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff08;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff08;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .pair-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #444;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .pair-btn:hover, .pair-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #000;
        }

        .chart-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .ticker-display {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            align-items: baseline;
        }

        .ticker-price {
            font-size: 2rem;
            font-weight: bold;
        }

        .ticker-change {
            font-weight: bold;
        }

        .price-up { color: var(--accent-color); }
        .price-down { color: var(--bear-color); }

        .chart-container {
            position: relative;
            height: 500px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>OneAfri Financial Terminal</h2>
        <div class="status-badge">
            <div class="pulse-dot"></div> Live Socket Active
        </div>
    </header>

    <div class="controls">
        <button class="pair-btn active" onclick="switchPair('OAF/USD')">OAF/USD</button>
        <button class="pair-btn" onclick="switchPair('OAF/EUR')">OAF/EUR</button>
        <button class="pair-btn" onclick="switchPair('OAF/GBP')">OAF/GBP</button>
        <button class="pair-btn" onclick="switchPair('OAF/JPY')">OAF/JPY</button>
    </div>

    <div class="chart-card">
        <div class="ticker-display">
            <span id="active-pair-title" style="font-size: 1.2rem; color: #aaa;">OAF/USD</span>
            <span id="current-price" class="ticker-price price-up">0.00000</span>
            <span id="price-change" class="ticker-change price-up">+0.00%</span>
        </div>
        <div class="chart-container">
            <canvas id="financialChart"></canvas>
        </div>
    </div>
</div>

<script>
    // Configuration Base Prices for Pairs
    const pairConfigs = {
        'OAF/USD': { base: 1.0500, decimals: 5, step: 0.0005 },
        'OAF/EUR': { base: 0.8800, decimals: 5, step: 0.0004 },
        'OAF/GBP': { base: 0.7600, decimals: 5, step: 0.0003 },
        'OAF/JPY': { base: 114.50, decimals: 2, step: 0.25 }
    };

    let activePair = 'OAF/USD';
    let chartInstance = null;
    let chartData = [];
    let liveTickInterval = null;

    // Generate Initial Static Candle Dataset
    function generateInitialData(pair) {
        const config = pairConfigs[pair];
        const data = [];
        let now = luxon.DateTime.now().minus({ minutes: 30 });
        let currentPrice = config.base;

        for (let i = 0; i < 30; i++) {
            const open = currentPrice;
            const variation = (Math.random() - 0.48) * config.step * 4;
            const close = open + variation;
            const high = Math.max(open, close) + Math.random() * config.step;
            const low = Math.min(open, close) - Math.random() * config.step;

            data.push({
                x: now.toMillis(),
                o: parseFloat(open.toFixed(config.decimals)),
                h: parseFloat(high.toFixed(config.decimals)),
                l: parseFloat(low.toFixed(config.decimals)),
                c: parseFloat(close.toFixed(config.decimals))
            });

            currentPrice = close;
            now = now.plus({ minutes: 1 });
        }
        return data;
    }

    // Initialize Chart
    function initChart() {
        const ctx = document.getElementById('financialChart').getContext('2d');
        chartData = generateInitialData(activePair);

        chartInstance = new Chart(ctx, {
            type: 'candlestick',
            data: {
                datasets: [{
                    label: activePair,
                    data: chartData,
                    color: {
                        up: '#4CAF50',
                        down: '#F44336',
                        unchanged: '#999999',
                    }
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            unit: 'minute'
                        },
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#888' }
                    },
                    y: {
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#888' }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });

        updateTickerDisplay();
        startRealtimeEngine();
    }

    // Dynamic Live Simulation Engine
    function startRealtimeEngine() {
        if (liveTickInterval) clearInterval(liveTickInterval);

        liveTickInterval = setInterval(() => {
            if (!chartData || chartData.length === 0) return;

            const config = pairConfigs[activePair];
            const lastCandle = chartData[chartData.length - 1];
            const delta = (Math.random() - 0.49) * config.step;
            const newPrice = parseFloat((lastCandle.c + delta).toFixed(config.decimals));

            // Update active candle prices dynamically
            lastCandle.c = newPrice;
            lastCandle.h = Math.max(lastCandle.h, newPrice);
            lastCandle.l = Math.min(lastCandle.l, newPrice);

            chartInstance.update('none'); // Silent update for smooth rendering
            updateTickerDisplay();
        }, 1000); // Ticks every 1 second
    }

    // Update Banner Pricing Elements
    function updateTickerDisplay() {
        if (!chartData.length) return;
        const config = pairConfigs[activePair];
        const lastCandle = chartData[chartData.length - 1];
        const firstCandle = chartData[0];

        const currentPriceEl = document.getElementById('current-price');
        const priceChangeEl = document.getElementById('price-change');

        const price = lastCandle.c.toFixed(config.decimals);
        const changePercent = (((lastCandle.c - firstCandle.o) / firstCandle.o) * 100).toFixed(2);

        currentPriceEl.innerText = price;
        
        if (changePercent >= 0) {
            currentPriceEl.className = 'ticker-price price-up';
            priceChangeEl.className = 'ticker-change price-up';
            priceChangeEl.innerText = `+${changePercent}%`;
        } else {
            currentPriceEl.className = 'ticker-price price-down';
            priceChangeEl.className = 'ticker-change price-down';
            priceChangeEl.innerText = `${changePercent}%`;
        }
    }

    // Switch Selected Pair Dynamically
    function switchPair(pair) {
        activePair = pair;
        document.getElementById('active-pair-title').innerText = pair;

        // Update button states
        document.querySelectorAll('.pair-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === pair);
        });

        // Regenerate datasets & refresh chart
        chartData = generateInitialData(pair);
        chartInstance.data.datasets[0].label = pair;
        chartInstance.data.datasets[0].data = chartData;
        chartInstance.update();

        updateTickerDisplay();
    }

    window.onload = initChart;
</script>
</body>
</html>
